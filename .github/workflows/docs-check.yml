name: docs-check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 문서 참조·훅 검사
        run: bash scripts/check-docs.sh
      - name: 리뷰 게이트 회귀 검사
        run: bash scripts/test-review-gate.sh
      - name: 정합성 검사 회귀 검사 (H · 준비도 롤업 · I 등재 대조 · J 계획 깊이)
        run: bash scripts/test-consistency.sh
      - name: 리포트 회귀 검사
        run: bash scripts/test-report.sh
      - name: 문서 검사 회귀 검사 (check-docs.sh 검사 1-c·5~12 가 붉어지는가)
        run: bash scripts/test-docs-check.sh
      - name: 설치·업그레이드 회귀 검사 (문서 골격만 심는가 · settings.json 병합 · 1.x 잔재의 해시 분류와 불간섭)
        run: bash scripts/test-install-upgrade.sh
      - name: 플러그인 훅 회귀 검사 (키트 표식이 있는 저장소만 판정하는가)
        run: bash scripts/test-hooks.sh
      - name: 런처 회귀 검사 (bin/mdm 분기표 · 실제 엔진 · 제품 CI 양식의 실행 줄)
        run: bash scripts/test-launcher.sh
      - name: 계약·실행 증거·변경 운영 회귀
        run: python3 -m unittest discover -s scripts/tests -v
